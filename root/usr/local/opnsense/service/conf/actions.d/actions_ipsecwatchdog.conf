[watchdog]
command:/usr/local/opnsense/scripts/OPNsense/IPsecWatchdog/watchdog.php
parameters:
type:script_output
message:running IPsec tunnel watchdog check
description:IPsec Tunnel Watchdog
; watchdog.php intentionally exits(1) when unconfigured, printing a
; diagnostic message first. Without "errors:no", a non-zero exit makes
; configd discard that output and return a generic "Execute error"
; instead (see modules/actions/script_output.py: check=not disable_errors).
errors:no

[status]
; script_output only returns captured stdout to the caller (stderr is only
; logged server-side, see modules/actions/script_output.py) but swanctl
; writes its connection/usage errors to stderr, so without "2>&1" a failure
; (e.g. charon/vici down) shows up as a silent blank result in the GUI.
command:/usr/local/sbin/swanctl --list-sas 2>&1
parameters:
type:script_output
message:fetching IPsec SA status
; swanctl exits non-zero when charon/vici is unreachable; without this the
; real diagnostic ("connecting to ... failed: ...") is replaced with a
; generic "Execute error", which defeats the point of a status button.
errors:no
